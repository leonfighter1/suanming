# Compliance Guard — rule layer, v0.1 (Phase 0 draft, pending legal review)
#
# Group selection is driven by compliance/geo_rule_matrix.json → regions.*.rule_groups.
# `global` always applies. Chinese patterns must cover BOTH simplified and traditional
# glyphs (launch market is zh-Hant).
#
# Fields:
#   id       stable rule id, referenced in violation reports and audit snapshots
#   pattern  ECMAScript regex source (flag "u" always on; add "i" via flags)
#   unless   optional regex; if it matches the SENTENCE containing the hit, the hit
#            is exempt (used for negations, e.g. "results are not guaranteed")
#   action   block | review
#
# Test cases live in test/fixtures/compliance-cases.yaml. Every rule needs at least
# one block case and one allow case.
version: 0.1.0

groups:
  global:
    - id: G001
      description: 付费/化解恐吓 — 不付费/不化解则有坏后果
      # Doc draft was: 不(付费|化解|转运).{0,12}(会|将|必然)
      # That blocks benign copy ("不付费也会看到基础解读") and misses zh-Hant.
      # Refined: require a negative-consequence term after the modal verb.
      pattern: "不(付费|付費|化解|转运|轉運|处理|處理|做法事|开运|開運)(的话|的話)?.{0,12}(会|會|将|將|必然|必定|就).{0,8}(灾|災|祸|禍|破财|破財|血光|厄运|厄運|倒霉|倒楣|不顺|不順|失去|离婚|離婚|分手|生病|大病|出事|恶化|惡化|应验|應驗)"
      action: block
    - id: G002
      description: 不化解后果自负类
      pattern: "不(付费|付費|化解|转运|轉運|处理|處理|做法事).{0,6}(后果|後果)"
      action: block
    - id: G003
      description: 宿命论确定性断言
      pattern: "(注定|註定|一定会|一定會|必然|必定)(会|會)?.{0,4}(发生|發生|出现|出現|失去|离婚|離婚|破产|破產|死亡|生病|分手|失败|失敗|发财|發財|暴富|中奖|中獎)"
      unless: "(并非|並非|不是|沒有|没有|不一定|未必|无所谓|無所謂)[^。！？]{0,6}(注定|註定|一定|必然|必定)"
      action: block
    - id: G004
      description: 寿命/死亡时间预测
      pattern: "(寿命|壽命|阳寿|陽壽|活不过|活不過|大限).{0,8}([0-9]+|[一二三四五六七八九十百]+)(岁|歲|年)"
      action: block
    - id: G005
      description: 医疗功效宣称（中文）
      pattern: "(治愈|治癒|根治|治好|治疗|治療).{0,10}(病|癌|症|疾)"
      action: block
    - id: G006
      description: 疾病预测/诊断（健康主题只能给一般养生建议）
      pattern: "(会|會|将|將|必|一定|容易)(得|患上|患|罹患|染上)[^。！？，,]{0,6}(癌|病|症|中风|中風|糖尿|肿瘤|腫瘤)"
      action: block
    - id: G007
      description: 具体投资建议（事业财运主题）
      pattern: "(买入|買入|卖出|賣出|加仓|加倉|抄底|梭哈|重仓|重倉)[^。！？]{0,8}(股票|股|基金|币|幣|期货|期貨|房产|房產)?"
      action: review
    - id: G008
      description: 以供奉、法事或改運化解籤意（v4.3.0 求籤）— 添香油錢、點光明燈、安太歲等被說成化解或轉運的條件
      pattern: "(添香油|點光明燈|点光明灯|安太歲|安太岁|祭改|補財庫|补财库|改運|改运|請符|请符|買符|买符|護身符|护身符|再抽一支|再求一支).{0,12}(才能|才會|才会|就能|就會|就会|即可|才可以|就可以|方能|可以化解|可化解|化解|轉運|转运)"
      unless: "(不必|不需要|不用|無需|无需|毋須|毋须|並不需要|并不需要)[^。！？]{0,4}(靠)?(添香油|點光明燈|点光明灯|安太歲|安太岁|祭改|補財庫|补财库|改運|改运|請符|请符|買符|买符|護身符|护身符|再抽|再求)"
      action: block

  en_common:
    - id: E001
      description: Deterministic outcome claims
      pattern: "\\b(guaranteed|destined to|will definitely|will certainly)\\b"
      flags: i
      unless: "\\b(not|no|never|nothing|cannot|can't|isn't|aren't|without)\\b(\\s+\\S+){0,3}\\s+(guaranteed|destined|definitely|certainly)"
      action: block
    - id: E002
      description: Disease prediction / diagnosis
      pattern: "\\b(will|likely to|bound to|prone to)\\s+(get|develop|suffer from|contract)\\s+(\\w+\\s+){0,2}(cancer|disease|diabetes|illness|tumou?r|stroke)"
      flags: i
      action: block

  us:
    - id: US001
      description: Paywall consequence framing ("unless you pay … bad things")
      pattern: "\\bunless you (pay|buy|purchase|upgrade|subscribe)\\b.{0,40}\\b(misfortune|bad luck|curse|lose|suffer|danger)"
      flags: i
      action: block

  uk:
    - id: UK001
      description: Accuracy claims
      pattern: "(accurate prediction|foolproof|100% accurate)"
      flags: i
      unless: "\\b(not|no|never)\\b(\\s+\\S+){0,3}\\s+(an? )?(accurate prediction|foolproof|100% accurate)"
      action: block

  au:
    - id: AU001
      description: Future-certainty phrasing
      pattern: "\\b(will happen|is destined)\\b"
      flags: i
      unless: "\\b(not|no|never|nothing)\\b(\\s+\\S+){0,3}\\s+(will happen|is destined)"
      action: block

  ca: []

  eu:
    - id: EU001
      description: Health claims
      pattern: "\\b(cure|heal|treat)\\w*\\b.{0,20}\\b(disease|illness)"
      flags: i
      unless: "\\b(not|no|never|isn't|cannot)\\b(\\s+\\S+){0,3}\\s+(cure|heal|treat)"
      action: block

  # 风水 output only (v4.4.0; the owner's Phase 3 §4: 无吉凶断言句式). Not a region's group: the pipeline adds
  # it for 风水 readings (METHOD_RULE_GROUPS), on top of the region's.
  fengshui:
    - id: F001
      description: 住宅吉凶断言（凶宅、犯煞、风水不好）
      pattern: "(凶宅|犯煞|沖煞|冲煞|煞氣|煞气|擋煞|挡煞|化煞|大凶|風水不好|风水不好|風水很差|风水很差|風水差|风水差)"
      unless: "(不是|并非|並非|沒有|没有|不談|不谈|不說|不说|不涉及|無關|无关)[^。！？]{0,8}(凶宅|犯煞|沖煞|冲煞|煞氣|煞气|擋煞|挡煞|化煞|大凶|風水不好|风水不好|風水很差|风水很差|風水差|风水差)"
      action: block
    - id: F002
      description: 把布局和财运、婚姻、子嗣或运气挂钩
      pattern: "(招財|招财|旺財|旺财|破財|破财|漏財|漏财|聚財|聚财|旺丁|損丁|损丁|旺夫|剋夫|克夫|招桃花|旺桃花|轉運|转运|開運|开运|改運|改运)"
      unless: "(不是|并非|並非|沒有|没有|不談|不谈|不說|不说|不涉及|無關|无关|不必|不需要|不用)[^。！？]{0,8}(招財|招财|旺財|旺财|破財|破财|漏財|漏财|聚財|聚财|旺丁|損丁|损丁|旺夫|剋夫|克夫|招桃花|旺桃花|轉運|转运|開運|开运|改運|改运)"
      action: block

  # 起名 output only (v5.2.0; the owner's Phase 3 gate: 起名/风水输出全部通过 Compliance Guard 专项规则). Like
  # `fengshui`, the pipeline adds it for 起名 readings (METHOD_RULE_GROUPS), on top of the region's.
  naming:
    - id: N001
      description: 名字决定命运 (a name decides fate)
      pattern: "(名字|姓名|名)[^。！？.!?]{0,8}(決定|决定|注定|主宰|左右)[^。！？.!?]{0,8}(命運|命运|一生|人生|前途|運勢|运势)|\\bnames?\\b[^.!?]{0,30}\\b(decides?|determines?|seals?|controls?)\\b[^.!?]{0,20}\\b(fate|destiny|fortune|life)\\b"
      flags: i
      unless: "(不會|不会|不能|並不|并不|不|沒有|没有|無法|无法|並非|并非)[^。！？]{0,4}(決定|决定|注定|主宰|左右)|\\b(not|never|no one's|nobody's|doesn't|does not|don't|cannot|can't|won't)\\b"
      action: block
    - id: N002
      description: 名字当作化解或招财的手段 (a name as a cure or a charm)
      pattern: "(改名|換名|换名|更名)[^。！？.!?]{0,8}(轉運|转运|改運|改运|開運|开运|化解|招財|招财|旺財|旺财|消災|消灾)|(旺夫|旺妻|招財|招财|旺財|旺财|剋夫|克夫|剋妻|克妻|帶財|带财)之?名|\\bchange (your|the|a) name\\b[^.!?]{0,20}\\b(luck|fortune|fate)\\b|\\b(lucky|unlucky) names?\\b"
      flags: i
      unless: "(不必|不需要|不用|不是|並非|并非|沒有|没有|無關|无关|不能|不會|不会)[^。！？]{0,6}(改名|換名|换名|更名|旺夫|旺妻|招財|招财|旺財|旺财)|(改名|換名|换名|更名)[^。！？]{0,4}(不會|不会|不能|無法|无法|並不|并不|不)|\\b(no|not|never|don't|doesn't|no need)\\b"
      action: block
    - id: N003
      description: 对名字下吉凶断语 (a 吉凶 verdict on a name)
      pattern: "(此名|這個名字|这个名字|名字|姓名|這名|这名)[^。！？.!?]{0,6}(大吉|大凶|不吉|兇|凶)"
      unless: "(不分|不論|不论|無所謂|无所谓|沒有|没有|不談|不谈|不說|不说|無關|无关)[^。！？]{0,6}(吉凶|大吉|大凶|兇|凶)"
      action: block

  # Indonesia (v5.1.0; the owner's Phase 3 §2.4: 屏蔽前世/通灵/降头). The region's `content_blocks` also tell
  # the model, since a recorded hit still reaches the reader while review is paused.
  id:
    - id: I001
      description: 前世、轮回转世 (past lives, reincarnation)
      pattern: "(前世|前生|轉世|转世|輪迴|轮回|\\bpast[- ]li(fe|ves)\\b|\\bprevious li(fe|ves)\\b|\\breincarnat\\w*)"
      flags: i
      unless: "(不是|并非|並非|沒有|没有|不談|不谈|不說|不说|不涉及|無關|无关)[^。！？]{0,8}(前世|前生|轉世|转世|輪迴|轮回)|\\b(no|not|never|nothing about|without)\\b(\\s+\\S+){0,3}\\s+(past[- ]li(fe|ves)|previous li(fe|ves)|reincarnat\\w*)"
      action: block
    - id: I002
      description: 通灵、灵媒、招魂 (mediumship, contacting the dead)
      pattern: "(通靈|通灵|靈媒|灵媒|招魂|問米|问米|觀落陰|观落阴|\\bspirit mediums?\\b|\\bmediumship\\b|\\bs[ée]ances?\\b|\\bchannel{1,2}ing (the )?(spirits?|dead)\\b|\\bcontact(ing)? (the )?(dead|spirits?)\\b)"
      flags: i
      unless: "(不是|并非|並非|沒有|没有|不談|不谈|不說|不说|不涉及|無關|无关)[^。！？]{0,8}(通靈|通灵|靈媒|灵媒|招魂|問米|问米|觀落陰|观落阴)|\\b(no|not|never|nothing about|without)\\b(\\s+\\S+){0,3}\\s+(spirit mediums?|mediumship|s[ée]ances?|channel{1,2}ing|contact(ing)?)"
      action: block
    - id: I003
      description: 降头、蛊、黑魔法 (black magic)
      pattern: "(降頭|降头|下蠱|下蛊|蠱毒|蛊毒|黑魔法|黑巫術|黑巫术|\\bblack magic\\b|\\bsantet\\b|\\bguna-guna\\b|\\bvoodoo\\b)"
      flags: i
      unless: "(不是|并非|並非|沒有|没有|不談|不谈|不說|不说|不涉及|無關|无关)[^。！？]{0,8}(降頭|降头|下蠱|下蛊|蠱毒|蛊毒|黑魔法|黑巫術|黑巫术)|\\b(no|not|never|nothing about|without)\\b(\\s+\\S+){0,3}\\s+(black magic|santet|guna-guna|voodoo)"
      action: block
