name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Same gates as .harness.json (run locally with the harness-check skill).
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Share images (S7) are set in a CJK font the server must have, as it has libvips.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm run lint
      - run: npm test
      - run: npm run validate:openapi
      - run: npm run validate:schemas
      - run: npm audit --audit-level=high
      # Technical verification: engine vs independent oracle, tarot statistics.
      - run: npm run verify:bazi
      - run: npm run verify:tarot
      - run: npm run verify:qiuqian
      - run: npm run verify:liuyao
      # POC regression guards: astronomy-engine must stay within the 0.01° gate.
      - run: npm run poc:astrology
      - run: npm run poc:bazi-jieqi

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
